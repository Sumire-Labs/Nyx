name: Renovate Dependencies

on:
  # 定期実行 (毎週月曜日の午前6時 JST)
  schedule:
    - cron: '0 21 * * 0'  # 日曜日の21:00 UTC = 月曜日の06:00 JST
  
  # 手動実行を許可
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - trace
  
  # dependency dashboardからの実行
  repository_dispatch:
    types: [renovate]

jobs:
  renovate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v39.2.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          renovate-version: 37.59.8
        env:
          # Renovate環境変数
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <renovate[bot]@users.noreply.github.com>'
          RENOVATE_PLATFORM: 'github'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          
      - name: Renovate summary
        if: always()
        run: |
          echo "## Renovate実行結果 🤖" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **リポジトリ**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **実行時刻**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **トリガー**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          
          if [ -f renovate-summary.json ]; then
            echo "- **結果**: 詳細は Job Summaryを確認してください" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **結果**: 更新する依存関係はありませんでした" >> $GITHUB_STEP_SUMMARY
          fi